name: TaskFlow CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fix jest permissions
        run: chmod +x ./node_modules/.bin/jest

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t taskflow:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag taskflow:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker tag taskflow:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}