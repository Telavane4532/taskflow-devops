name: TaskFlow CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  node-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fix jest permissions
        run: chmod +x ./node_modules/.bin/jest || true

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t taskflow:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag taskflow:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker tag taskflow:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow:${{ github.sha }}

  django-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django_service/requirements.txt

      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: test-secret
          DJANGO_DEBUG: "true"
        run: |
          cd django_service
          python manage.py migrate
          python manage.py test

      - name: Build Django Docker image
        run: docker build -f django_service/Dockerfile -t taskflow-django:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Django image
        run: |
          docker tag taskflow-django:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-django:latest
          docker tag taskflow-django:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-django:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-django:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-django:${{ github.sha }}
