apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-node
  template:
    metadata:
      labels:
        app: taskflow-node
    spec:
      containers:
        - name: taskflow-node
          image: telavanetanmay/taskflow:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-node-service
spec:
  selector:
    app: taskflow-node
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-django
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-django
  template:
    metadata:
      labels:
        app: taskflow-django
    spec:
      containers:
        - name: taskflow-django
          image: telavanetanmay/taskflow-django:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-django-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "false"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-django-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: AI_PROVIDER
              value: "dummy"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-django-service
spec:
  selector:
    app: taskflow-django
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-celery
  template:
    metadata:
      labels:
        app: taskflow-celery
    spec:
      containers:
        - name: taskflow-celery
          image: telavanetanmay/taskflow-django:latest
          command: ["celery", "-A", "config", "worker", "-l", "info"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-django-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-django-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-redis
  template:
    metadata:
      labels:
        app: taskflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
